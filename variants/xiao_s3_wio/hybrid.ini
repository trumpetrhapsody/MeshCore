
; Experimental USB-first, dual-identity room/companion firmware for XIAO ESP32-S3 + Wio SX1262.
[env:Xiao_S3_WIO_hybrid_room_companion_usb]
extends = Xiao_S3_WIO
build_flags =
  ${Xiao_S3_WIO.build_flags}
  -D ENABLE_USB_INTERFACE
  -D ENABLE_HYBRID_ROOM_SERVER
  -D HYBRID_ROOM_POSTS=128
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=64
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Xiao_S3_WIO.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_S3_WIO_hybrid_room_companion_usb_wifi]
extends = Xiao_S3_WIO
build_flags =
  ${Xiao_S3_WIO.build_flags}
  -D ENABLE_USB_INTERFACE
  -D ENABLE_WIFI_INTERFACE
  -D ENABLE_HYBRID_ROOM_SERVER
  -D HYBRID_ROOM_POSTS=128
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=64
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Xiao_S3_WIO.lib_deps}
  densaugeo/base64 @ ~1.4.0
